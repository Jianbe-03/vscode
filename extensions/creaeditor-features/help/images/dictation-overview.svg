<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Dictation: choose a Whisper model once; while you talk, the listening bar above the input shows the sound and the spoken language chip (NL or EN), which you click or press Cmd+Alt+J to switch; right-click the microphone for Switch Speech Model, Spoken Language and How Dictation Works</title>
	<rect width="960" height="600" rx="16" fill="#16152D"/>

	<!-- 1 Choose once -->
	<text x="40" y="52" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">1  THE FIRST TIME: CHOOSE A MODEL</text>
	<rect x="40" y="68" width="880" height="96" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="64" y="100" fill="#F8F7FA" font-size="15" font-weight="600">Download a Speech Model for Dictation?</text>
	<text x="64" y="124" fill="#BCBBCA" font-size="13">Runs on this computer; your audio never leaves it. Downloaded once.</text>
	<g font-size="13">
		<rect x="64" y="134" width="196" height="24" rx="5" fill="#00EC95"/>
		<text x="162" y="151" fill="#16152D" font-weight="600" text-anchor="middle">Whisper Small (Faster)</text>
		<rect x="272" y="134" width="236" height="24" rx="5" fill="none" stroke="#3B3866"/>
		<text x="390" y="151" fill="#F8F7FA" text-anchor="middle">Whisper Large (More Accurate)</text>
		<rect x="520" y="134" width="64" height="24" rx="5" fill="none" stroke="#3B3866"/>
		<text x="552" y="151" fill="#F8F7FA" text-anchor="middle">Both</text>
	</g>
	<text x="606" y="151" fill="#8E8CA8" font-size="12">Small: 0.4 GB, fast · Large: 1.3 GB, best for mixed speech</text>

	<!-- 2 While you talk -->
	<text x="40" y="214" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">2  WHILE YOU TALK: THE LISTENING BAR</text>
	<!-- Listening bar -->
	<rect x="40" y="230" width="560" height="40" rx="10" fill="#1C1A37" stroke="#3B3866"/>
	<g stroke="#00EC95" stroke-width="2" stroke-linecap="round" opacity="0.95">
		<path d="M140 250 V250"/><path d="M146 248 V252"/><path d="M152 246 V254"/><path d="M158 249 V251"/>
		<path d="M164 244 V256"/><path d="M170 241 V259"/><path d="M176 245 V255"/><path d="M182 239 V261"/>
		<path d="M188 243 V257"/><path d="M194 247 V253"/><path d="M200 242 V258"/><path d="M206 238 V262"/>
		<path d="M212 241 V259"/><path d="M218 245 V255"/><path d="M224 240 V260"/><path d="M230 244 V256"/>
		<path d="M236 248 V252"/><path d="M242 243 V257"/><path d="M248 239 V261"/><path d="M254 242 V258"/>
		<path d="M260 246 V254"/><path d="M266 241 V259"/><path d="M272 237 V263"/><path d="M278 242 V258"/>
		<path d="M284 245 V255"/><path d="M290 240 V260"/><path d="M296 243 V257"/><path d="M302 247 V253"/>
		<path d="M308 244 V256"/><path d="M314 240 V260"/><path d="M320 238 V262"/><path d="M326 243 V257"/>
		<path d="M332 246 V254"/><path d="M338 242 V258"/><path d="M344 245 V255"/><path d="M350 248 V252"/>
		<path d="M356 244 V256"/><path d="M362 241 V259"/><path d="M368 246 V254"/><path d="M374 249 V251"/>
		<path d="M380 245 V255"/><path d="M386 242 V258"/><path d="M392 247 V253"/><path d="M398 249 V251"/>
	</g>
	<text x="420" y="255" fill="#BCBBCA" font-size="13">Listening…</text>
	<rect x="540" y="239" width="44" height="22" rx="5" fill="none" stroke="#00EC95" stroke-width="1.5"/>
	<text x="562" y="255" fill="#F8F7FA" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">NL</text>
	<!-- Input box -->
	<rect x="40" y="268" width="560" height="88" rx="10" fill="#211F3F" stroke="#3B3866"/>
	<text x="60" y="298" fill="#F8F7FA" font-size="14">Kun je de pull request voor de checkout pagina reviewen?</text>
	<text x="60" y="340" fill="#8E8CA8" font-size="12">Agent   Whisper Large</text>
	<circle cx="566" cy="334" r="14" fill="#00EC95" fill-opacity="0.15" stroke="#00EC95" stroke-width="1.5"/>
	<rect x="562.5" y="325" width="7" height="11" rx="3.5" fill="#00EC95"/>
	<path d="M559.5 333 A6.5 6.5 0 0 0 572.5 333 M566 339.5 V343 M562.5 343 H569.5" stroke="#00EC95" stroke-width="1.6" fill="none" stroke-linecap="round"/>

	<!-- Chip callout -->
	<g stroke="#00EC95" stroke-width="1.5" fill="none" stroke-linecap="round">
		<path d="M586 250 H640"/>
	</g>
	<rect x="644" y="226" width="276" height="96" rx="12" fill="#1C1A37" stroke="#00EC95"/>
	<text x="664" y="252" fill="#00EC95" font-size="14" font-weight="600">The language chip</text>
	<text x="664" y="274" fill="#BCBBCA" font-size="13">Click it, or press Cmd+Alt+J, to</text>
	<text x="664" y="292" fill="#BCBBCA" font-size="13">switch NL ⇄ EN. It applies from</text>
	<text x="664" y="310" fill="#BCBBCA" font-size="13">the next sentence and is remembered.</text>
	<text x="664" y="344" fill="#8E8CA8" font-size="12">Whisper cannot detect the language;</text>
	<text x="664" y="362" fill="#8E8CA8" font-size="12">set the one you are about to speak.</text>

	<!-- 3 Right-click -->
	<text x="40" y="410" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">3  RIGHT-CLICK THE MICROPHONE</text>
	<rect x="40" y="426" width="300" height="140" rx="10" fill="#1C1A37" stroke="#3B3866"/>
	<g font-size="13">
		<text x="60" y="452" fill="#8E8CA8">Select Microphone</text>
		<rect x="48" y="462" width="284" height="26" rx="5" fill="#252347"/>
		<text x="60" y="480" fill="#F8F7FA">Switch Speech Model...</text>
		<rect x="48" y="492" width="284" height="26" rx="5" fill="#252347"/>
		<text x="60" y="510" fill="#F8F7FA">Spoken Language...</text>
		<path d="M48 528 H332" stroke="#3B3866"/>
		<rect x="48" y="534" width="284" height="26" rx="5" fill="#252347"/>
		<text x="60" y="552" fill="#F8F7FA">How Dictation Works</text>
	</g>
	<g font-size="13">
		<path d="M340 475 H372" stroke="#8E8CA8" stroke-dasharray="3 3"/>
		<text x="380" y="480" fill="#BCBBCA">Whisper Small (faster) or Whisper Large (more accurate)</text>
		<path d="M340 505 H372" stroke="#8E8CA8" stroke-dasharray="3 3"/>
		<text x="380" y="510" fill="#BCBBCA">Any language: Dutch, English, German, …</text>
		<path d="M340 547 H372" stroke="#8E8CA8" stroke-dasharray="3 3"/>
		<text x="380" y="552" fill="#BCBBCA">Opens the Dictation page of the CreaEditor Guide</text>
	</g>
</svg>
