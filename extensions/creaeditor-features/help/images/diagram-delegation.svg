<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Delegate to Server: the chat, its code and its accounts go to the server; results come back as a local branch or a pull request; Take Back Here continues the chat on the laptop</title>
	<rect width="960" height="620" rx="16" fill="#16152D"/>

	<!-- Step labels -->
	<text x="40" y="52" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">1  DELEGATE</text>
	<text x="660" y="52" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">2  RUNS ON THE SERVER</text>

	<!-- Laptop chat -->
	<rect x="40" y="66" width="260" height="190" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="60" y="96" fill="#8E8CA8" font-size="13">Laptop · Agents window</text>
	<text x="60" y="120" fill="#F8F7FA" font-size="16" font-weight="600">Fix the login redirect</text>
	<rect x="56" y="138" width="228" height="100" rx="8" fill="#0F0E22" stroke="#3B3866"/>
	<text x="72" y="164" fill="#F8F7FA" font-size="13">This chat continues on</text>
	<text x="72" y="184" fill="#F8F7FA" font-size="13">Office Server.</text>
	<text x="72" y="214" fill="#00EC95" font-size="13">Open on Server · Take Back Here</text>

	<!-- What is sent -->
	<g stroke="#00EC95" stroke-width="2" fill="none" stroke-linecap="round">
		<path d="M304 160 H640"/>
		<path d="M630 150 L640 160 L630 170"/>
	</g>
	<rect x="330" y="86" width="286" height="52" rx="8" fill="#252347"/>
	<text x="346" y="108" fill="#F8F7FA" font-size="13" font-weight="600">Code: one git bundle</text>
	<text x="346" y="128" fill="#BCBBCA" font-size="13">branch + uncommitted + untracked</text>
	<rect x="330" y="182" width="286" height="52" rx="8" fill="#252347"/>
	<text x="346" y="204" fill="#F8F7FA" font-size="13" font-weight="600">The conversation + accounts</text>
	<text x="346" y="224" fill="#BCBBCA" font-size="13">session files · tokens and keys sealed</text>

	<!-- Server -->
	<rect x="652" y="66" width="268" height="190" rx="12" fill="#1C1A37" stroke="#00BD8B"/>
	<text x="672" y="96" fill="#8E8CA8" font-size="13">Office Server</text>
	<text x="900" y="96" fill="#00EC95" font-size="13" text-anchor="end">running</text>
	<text x="672" y="120" fill="#F8F7FA" font-size="16" font-weight="600">Fix the login redirect</text>
	<text x="672" y="150" fill="#BCBBCA" font-size="13">Own worktree on branch</text>
	<text x="672" y="170" fill="#F8F7FA" font-size="13">creaeditor/delegated/3f9a2c1d</text>
	<text x="672" y="204" fill="#BCBBCA" font-size="13">Same history; the laptop</text>
	<text x="672" y="224" fill="#BCBBCA" font-size="13">can be closed.</text>

	<!-- Results -->
	<text x="40" y="306" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">3  RESULTS COME BACK (CHOSEN WHEN DELEGATING)</text>
	<path d="M786 260 V300" stroke="#00EC95" stroke-width="2" fill="none"/>
	<path d="M786 300 H476 V320 M786 300 V320" stroke="#00EC95" stroke-width="2" fill="none"/>
	<path d="M466 312 L476 322 L486 312 M776 312 L786 322 L796 312" stroke="#00EC95" stroke-width="2" fill="none" stroke-linecap="round"/>

	<rect x="40" y="326" width="590" height="132" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<rect x="60" y="344" width="190" height="36" rx="8" fill="#00BD8B"/>
	<text x="155" y="367" fill="#0F0E22" font-size="13" font-weight="600" text-anchor="middle">Bring Back Changes</text>
	<text x="268" y="367" fill="#BCBBCA" font-size="13">when the laptop is online, into a local branch</text>
	<text x="60" y="406" fill="#F8F7FA" font-size="14">creaeditor/from-office-server/3f9a2c1d</text>
	<text x="60" y="436" fill="#BCBBCA" font-size="13">Bringing back never touches your files; then Compare, Checkout or Merge.</text>

	<rect x="650" y="326" width="270" height="132" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<rect x="670" y="344" width="230" height="36" rx="8" fill="#16152D" stroke="#3B3866"/>
	<text x="785" y="367" fill="#F8F7FA" font-size="13" font-weight="600" text-anchor="middle">Open PR from the Server</text>
	<text x="670" y="406" fill="#BCBBCA" font-size="13">The server pushes its branch</text>
	<text x="670" y="426" fill="#BCBBCA" font-size="13">and opens a pull request with</text>
	<text x="670" y="446" fill="#BCBBCA" font-size="13">its own GitHub token.</text>

	<!-- Take back -->
	<text x="40" y="502" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">4  OPTIONAL: TAKE BACK HERE</text>
	<rect x="40" y="516" width="880" height="72" rx="12" fill="#1C1A37" stroke="#3B3866" stroke-dasharray="6 5"/>
	<g stroke="#F2B24C" stroke-width="2" fill="none" stroke-linecap="round">
		<path d="M890 552 H80"/>
		<path d="M90 542 L80 552 L90 562"/>
	</g>
	<rect x="110" y="534" width="700" height="36" rx="8" fill="#1C1A37"/>
	<text x="460" y="557" fill="#F8F7FA" font-size="13" text-anchor="middle">The server's chat stops and is archived; the laptop chat continues from where it was delegated.</text>
</svg>
