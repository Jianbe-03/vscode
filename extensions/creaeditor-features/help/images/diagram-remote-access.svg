<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<title>Remote Access: a phone reaches the Agents window of your Mac over Tailscale, or over an optional public URL with a password</title>
	<rect width="960" height="560" rx="16" fill="#16152D"/>

	<!-- Phone -->
	<rect x="40" y="56" width="200" height="340" rx="28" fill="#1C1A37" stroke="#3B3866" stroke-width="2"/>
	<rect x="110" y="70" width="60" height="6" rx="3" fill="#2F2C55"/>
	<text x="140" y="108" fill="#8E8CA8" font-size="13" text-anchor="middle">Your phone: your chats</text>
	<rect x="60" y="124" width="160" height="40" rx="8" fill="#252347"/>
	<circle cx="78" cy="144" r="5" fill="#00EC95"/>
	<text x="92" y="141" fill="#F8F7FA" font-size="13">Fix login redirect</text>
	<text x="92" y="157" fill="#8E8CA8" font-size="11">running</text>
	<rect x="60" y="172" width="160" height="40" rx="8" fill="#252347"/>
	<circle cx="78" cy="192" r="5" fill="#F2B24C"/>
	<text x="92" y="189" fill="#F8F7FA" font-size="13">Upgrade test runner</text>
	<text x="92" y="205" fill="#8E8CA8" font-size="11">needs your approval</text>
	<rect x="60" y="220" width="160" height="40" rx="8" fill="#252347"/>
	<circle cx="78" cy="240" r="5" fill="#8E8CA8"/>
	<text x="92" y="237" fill="#F8F7FA" font-size="13">Update docs</text>
	<text x="92" y="253" fill="#8E8CA8" font-size="11">done</text>
	<rect x="60" y="330" width="160" height="40" rx="10" fill="#0F0E22" stroke="#2F2C55"/>
	<text x="76" y="355" fill="#8E8CA8" font-size="13">Send a message…</text>
	<text x="140" y="292" fill="#BCBBCA" font-size="13" text-anchor="middle">Agents window,</text>
	<text x="140" y="310" fill="#BCBBCA" font-size="13" text-anchor="middle">phone layout</text>

	<!-- Path 1: Tailscale -->
	<rect x="288" y="80" width="360" height="118" rx="12" fill="#1C1A37" stroke="#00BD8B"/>
	<text x="308" y="110" fill="#00EC95" font-size="13" font-weight="600" letter-spacing="1">TAILSCALE (DEFAULT)</text>
	<text x="308" y="136" fill="#F8F7FA" font-size="15">http://100.x.y.z:8790</text>
	<text x="308" y="160" fill="#BCBBCA" font-size="13">Only devices in your tailnet can reach it.</text>
	<text x="308" y="180" fill="#BCBBCA" font-size="13">Encrypted by WireGuard.</text>
	<g stroke="#00EC95" stroke-width="2" fill="none" stroke-linecap="round">
		<path d="M244 150 H284"/>
		<path d="M652 150 H700"/>
		<path d="M690 140 L700 150 L690 160"/>
	</g>

	<!-- Path 2: public URL -->
	<rect x="288" y="226" width="360" height="140" rx="12" fill="#1C1A37" stroke="#3B3866" stroke-dasharray="6 5"/>
	<text x="308" y="256" fill="#F2B24C" font-size="13" font-weight="600" letter-spacing="1">PUBLIC URL (OPTIONAL, OFF)</text>
	<text x="308" y="282" fill="#F8F7FA" font-size="15">https://my-mac.tailnet.ts.net</text>
	<text x="308" y="306" fill="#BCBBCA" font-size="13">Tailscale Funnel, from anywhere over HTTPS.</text>
	<text x="308" y="326" fill="#BCBBCA" font-size="13">New devices need the pairing code</text>
	<text x="308" y="346" fill="#BCBBCA" font-size="13">and your password.</text>
	<g stroke="#8E8CA8" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="5 5">
		<path d="M244 296 H284"/>
		<path d="M652 296 H700"/>
	</g>
	<path d="M690 286 L700 296 L690 306" stroke="#8E8CA8" stroke-width="2" fill="none" stroke-linecap="round"/>

	<!-- Mac -->
	<rect x="712" y="56" width="208" height="340" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="736" y="90" fill="#8E8CA8" font-size="13">Your Mac</text>
	<text x="736" y="114" fill="#F8F7FA" font-size="16" font-weight="600">CreaEditor</text>
	<rect x="728" y="132" width="176" height="62" rx="8" fill="#252347"/>
	<text x="744" y="158" fill="#F8F7FA" font-size="13" font-weight="600">Remote Access</text>
	<text x="744" y="178" fill="#BCBBCA" font-size="13">checks the device key</text>
	<path d="M816 198 V214" stroke="#00EC95" stroke-width="2"/>
	<rect x="728" y="218" width="176" height="62" rx="8" fill="#252347"/>
	<text x="744" y="244" fill="#F8F7FA" font-size="13" font-weight="600">Agent host</text>
	<text x="744" y="264" fill="#BCBBCA" font-size="13">the same chats as here</text>
	<text x="736" y="314" fill="#BCBBCA" font-size="13">Claude, Codex and</text>
	<text x="736" y="334" fill="#BCBBCA" font-size="13">Copilot CLI keep running</text>
	<text x="736" y="354" fill="#BCBBCA" font-size="13">on the Mac, which stays</text>
	<text x="736" y="374" fill="#BCBBCA" font-size="13">awake while they run.</text>

	<!-- Pairing strip -->
	<text x="40" y="440" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">PAIRING A DEVICE, ONCE</text>
	<rect x="40" y="456" width="280" height="68" rx="10" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="60" y="484" fill="#F8F7FA" font-size="14" font-weight="600">1  Scan the QR code</text>
	<text x="60" y="506" fill="#BCBBCA" font-size="13">address + one-time code (10 min)</text>
	<rect x="340" y="456" width="280" height="68" rx="10" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="360" y="484" fill="#F8F7FA" font-size="14" font-weight="600">2  Name the device</text>
	<text x="360" y="506" fill="#BCBBCA" font-size="13">such as "iPhone (Safari)"</text>
	<rect x="640" y="456" width="280" height="68" rx="10" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="660" y="484" fill="#F8F7FA" font-size="14" font-weight="600">3  Device key in the browser</text>
	<text x="660" y="506" fill="#BCBBCA" font-size="13">Sign Out on the Mac ends it</text>
	<g stroke="#00EC95" stroke-width="2" fill="none" stroke-linecap="round">
		<path d="M322 490 H338"/>
		<path d="M622 490 H638"/>
	</g>
</svg>
