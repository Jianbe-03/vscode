<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<rect width="960" height="600" rx="16" fill="#16152D"/>

	<!-- Model picker grouped per key -->
	<rect x="40" y="40" width="420" height="380" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<rect x="60" y="60" width="380" height="36" rx="6" fill="#16152D" stroke="#3B3866"/>
	<text x="76" y="84" fill="#8E8CA8" font-size="14">Search models</text>

	<text x="60" y="130" fill="#8E8CA8" font-size="12" font-weight="600" letter-spacing="1">WORK KEY</text>
	<rect x="56" y="140" width="388" height="36" rx="6" fill="#2A2850"/>
	<text x="76" y="164" fill="#00EC95" font-size="14">✓</text>
	<text x="98" y="164" fill="#F8F7FA" font-size="15">Claude Opus 5.5 (Work key)</text>
	<text x="98" y="204" fill="#F8F7FA" font-size="15">GPT-5.6 (Work key)</text>

	<text x="60" y="252" fill="#8E8CA8" font-size="12" font-weight="600" letter-spacing="1">PERSONAL KEY</text>
	<text x="98" y="284" fill="#F8F7FA" font-size="15">Claude Opus 5.5 (Personal key)</text>
	<text x="98" y="320" fill="#F8F7FA" font-size="15">Gemini 3 Pro (Personal key)</text>

	<line x1="60" y1="348" x2="440" y2="348" stroke="#2F2C55"/>
	<text x="76" y="384" fill="#BCBBCA" font-size="14">+ Add OpenRouter or LiteLLM Models…</text>

	<!-- A chat locked to its key -->
	<rect x="500" y="40" width="420" height="380" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="524" y="76" fill="#F8F7FA" font-size="16" font-weight="600">Chat on Work key</text>
	<rect x="524" y="96" width="372" height="44" rx="8" fill="#16152D" stroke="#2F2C55"/>
	<circle cx="546" cy="118" r="5" fill="#00EC95"/>
	<text x="560" y="123" fill="#F8F7FA" font-size="14">Research subagent · Work key</text>
	<rect x="544" y="152" width="352" height="44" rx="8" fill="#16152D" stroke="#2F2C55"/>
	<circle cx="566" cy="174" r="5" fill="#00EC95"/>
	<text x="580" y="179" fill="#F8F7FA" font-size="14">Its own subagent · Work key</text>
	<rect x="524" y="216" width="372" height="92" rx="8" fill="#2B1F24" stroke="#5A3340"/>
	<text x="544" y="244" fill="#F28B8B" font-size="14" font-weight="600">Subagent refused</text>
	<text x="544" y="268" fill="#BCBBCA" font-size="13">'Gemini 3 Pro (Personal key)' is not available</text>
	<text x="544" y="288" fill="#BCBBCA" font-size="13">to this chat: subagents stay on Work key.</text>
	<text x="524" y="348" fill="#8E8CA8" font-size="13">Every request of this chat and its subagents</text>
	<text x="524" y="368" fill="#8E8CA8" font-size="13">goes out with the Work key, and only that key.</text>

	<text x="40" y="480" fill="#F8F7FA" font-size="20" font-weight="600">Several OpenRouter and LiteLLM keys</text>
	<text x="40" y="512" fill="#BCBBCA" font-size="15">Each key keeps its own spending limit. The key name follows every model,</text>
	<text x="40" y="536" fill="#BCBBCA" font-size="15">and a chat never borrows another key, not even for its subagents.</text>
</svg>
