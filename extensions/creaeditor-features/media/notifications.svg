	<text x="260" y="374" fill="#8E8CA8" font-size="12" text-anchor="middle">Scan it in the ntfy app (tap +)</text>
	<text x="260" y="396" fill="#C9C7DD" font-size="12" text-anchor="middle" font-family="Menlo, monospace">ntfy.sh/creaeditor-3f9c…a17e</text>

