		<rect x="236" y="306" width="10" height="10"/><rect x="266" y="316" width="10" height="10"/><rect x="326" y="306" width="10" height="10"/>
		<rect x="296" y="316" width="10" height="10"/><rect x="326" y="266" width="10" height="10"/>
