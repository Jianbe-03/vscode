<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<rect width="960" height="600" rx="16" fill="#16152D"/>

	<!-- Add AI Budget: the quick picks -->
	<rect x="40" y="40" width="420" height="300" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="250" y="70" fill="#BCBBCA" font-size="13" text-anchor="middle">When the Budget Is Used Up</text>
	<rect x="60" y="84" width="380" height="34" rx="6" fill="#16152D" stroke="#3B3866"/>
	<rect x="60" y="130" width="380" height="44" rx="6" fill="#2A2850"/>
	<text x="76" y="157" fill="#F8F7FA" font-size="15">Warn Only</text>
	<text x="160" y="157" fill="#8E8CA8" font-size="13">Notify at 80% and 100%</text>
	<text x="76" y="203" fill="#F8F7FA" font-size="15">Warn and Stop</text>
	<text x="186" y="203" fill="#8E8CA8" font-size="13">Also refuse requests once</text>
	<text x="186" y="221" fill="#8E8CA8" font-size="13">the budget is used up</text>
	<line x1="60" y1="244" x2="440" y2="244" stroke="#2F2C55"/>
	<text x="60" y="272" fill="#8E8CA8" font-size="13">Before this: what it is for (a key, an issue</text>
	<text x="60" y="292" fill="#8E8CA8" font-size="13">or a repository), the amount in US dollars,</text>
	<text x="60" y="312" fill="#8E8CA8" font-size="13">and per day, week or month.</text>

	<!-- The alert -->
	<rect x="500" y="40" width="420" height="132" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<circle cx="528" cy="70" r="9" fill="none" stroke="#F2B24C" stroke-width="2"/>
	<rect x="527" y="65" width="2" height="6" fill="#F2B24C"/>
	<rect x="527" y="73" width="2" height="2" fill="#F2B24C"/>
	<text x="548" y="75" fill="#F8F7FA" font-size="14">The Work key has used 80% of its</text>
	<text x="548" y="95" fill="#F8F7FA" font-size="14">$50.00 monthly budget.</text>
	<rect x="700" y="120" width="112" height="32" rx="6" fill="#00BD8B"/>
	<text x="756" y="141" fill="#0F0E13" font-size="13" font-weight="600" text-anchor="middle">Open AI Costs</text>
	<rect x="820" y="120" width="84" height="32" rx="6" fill="#2F2C55"/>
	<text x="862" y="141" fill="#F8F7FA" font-size="13" text-anchor="middle">Edit Budget</text>

	<!-- The hard stop in a chat -->
	<rect x="500" y="196" width="420" height="144" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="524" y="226" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">WITH WARN AND STOP</text>
	<rect x="524" y="242" width="372" height="76" rx="8" fill="#2B1F24" stroke="#5A3340"/>
	<text x="544" y="268" fill="#F28B8B" font-size="14">The monthly budget of $50.00 for the</text>
	<text x="544" y="288" fill="#F28B8B" font-size="14">Work key is used up. Raise it on the</text>
	<text x="544" y="308" fill="#F28B8B" font-size="14">AI Costs page.</text>

	<text x="40" y="410" fill="#F8F7FA" font-size="20" font-weight="600">Budgets per key, issue or repository</text>
	<text x="40" y="442" fill="#BCBBCA" font-size="15">Set an amount per day, week or month. A notification comes at 80% and 100%,</text>
	<text x="40" y="466" fill="#BCBBCA" font-size="15">once per period. With Warn and Stop, the requests of that key, issue or</text>
	<text x="40" y="490" fill="#BCBBCA" font-size="15">repository, subagents included, are refused until the budget starts over.</text>
	<text x="40" y="540" fill="#8E8CA8" font-size="13">Add one with Add Budget on the AI Costs page, or Chat: Add AI Budget in the Command Palette.</text>
</svg>
