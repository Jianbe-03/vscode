<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<rect width="960" height="600" rx="16" fill="#16152D"/>

	<!-- The user's request -->
	<rect x="560" y="48" width="360" height="48" rx="10" fill="#2A2850"/>
	<text x="584" y="78" fill="#F8F7FA" font-size="16">Refactor the checkout flow</text>

	<!-- The agent's answer, cut off by the limit -->
	<text x="40" y="140" fill="#BCBBCA" font-size="15">I split the checkout into three steps and moved the price</text>
	<text x="40" y="164" fill="#BCBBCA" font-size="15">calculation into its own service. Next I will update the tests…</text>

	<!-- The limit message with its buttons -->
	<rect x="40" y="196" width="880" height="168" rx="12" fill="#1C1A37" stroke="#4A3A2A"/>
	<circle cx="72" cy="230" r="10" fill="none" stroke="#F2B24C" stroke-width="2"/>
	<rect x="71" y="224" width="2" height="7" fill="#F2B24C"/>
	<rect x="71" y="233" width="2" height="2" fill="#F2B24C"/>
	<text x="94" y="236" fill="#F8F7FA" font-size="17" font-weight="600">The Claude account Work is used up</text>
	<text x="94" y="264" fill="#BCBBCA" font-size="14">Its 5-hour limit resets in 2h 14m. Personal still has usage left.</text>
	<rect x="94" y="292" width="220" height="40" rx="8" fill="#00BD8B"/>
	<text x="204" y="317" fill="#0F0E13" font-size="15" font-weight="600" text-anchor="middle">Continue on Personal</text>
	<rect x="330" y="292" width="268" height="40" rx="8" fill="none" stroke="#3B3866"/>
	<text x="464" y="317" fill="#F8F7FA" font-size="15" text-anchor="middle">Always Switch Automatically</text>

	<!-- After switching -->
	<rect x="40" y="396" width="880" height="44" rx="10" fill="#1A2B2A"/>
	<text x="64" y="424" fill="#7FE3C1" font-size="14">Claude account Work hit its limit; continued on Personal.</text>
	<text x="40" y="478" fill="#BCBBCA" font-size="15">The tests are updated and pass. The checkout now has three steps…</text>

	<!-- Footer: how accounts are added -->
	<text x="40" y="548" fill="#8E8CA8" font-size="13">Add Claude Account: paste a setup-token or sign in with the browser · Add Codex Account: sign in with ChatGPT</text>
</svg>
