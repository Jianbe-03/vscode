<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
	<rect width="960" height="600" rx="16" fill="#16152D"/>

	<!-- The user's request -->
	<rect x="560" y="40" width="360" height="48" rx="10" fill="#2A2850"/>
	<text x="584" y="70" fill="#F8F7FA" font-size="16">Refactor the checkout flow</text>

	<!-- The agent's answer, cut off by the limit -->
	<text x="40" y="128" fill="#BCBBCA" font-size="15">I split the checkout into three steps and moved the price</text>
	<text x="40" y="152" fill="#BCBBCA" font-size="15">calculation into its own service. Next I will update the tests…</text>

	<!-- The limit message with its buttons -->
	<rect x="40" y="180" width="880" height="140" rx="12" fill="#1C1A37" stroke="#4A3A2A"/>
	<circle cx="72" cy="214" r="10" fill="none" stroke="#F2B24C" stroke-width="2"/>
	<rect x="71" y="208" width="2" height="7" fill="#F2B24C"/>
	<rect x="71" y="217" width="2" height="2" fill="#F2B24C"/>
	<text x="94" y="220" fill="#F8F7FA" font-size="16">The Claude account Work has reached its usage limit; it resets in 2h 14m.</text>
	<rect x="94" y="252" width="196" height="40" rx="8" fill="#00BD8B"/>
	<text x="192" y="277" fill="#0F0E13" font-size="15" font-weight="600" text-anchor="middle">Continue on Personal</text>
	<rect x="302" y="252" width="250" height="40" rx="8" fill="#00BD8B"/>
	<text x="427" y="277" fill="#0F0E13" font-size="15" font-weight="600" text-anchor="middle">Always Switch Automatically</text>
	<rect x="564" y="252" width="250" height="40" rx="8" fill="#00BD8B"/>
	<text x="689" y="277" fill="#0F0E13" font-size="15" font-weight="600" text-anchor="middle">Continue When Usage Resets</text>

	<!-- What each choice does -->
	<rect x="40" y="348" width="428" height="150" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="64" y="380" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">CONTINUE ON PERSONAL</text>
	<rect x="56" y="396" width="396" height="44" rx="10" fill="#1A2B2A"/>
	<text x="70" y="423" fill="#7FE3C1" font-size="13">Claude account Work hit its limit; continued on Personal.</text>
	<text x="64" y="482" fill="#BCBBCA" font-size="14">The chat goes on with its whole conversation.</text>

	<rect x="492" y="348" width="428" height="150" rx="12" fill="#1C1A37" stroke="#2F2C55"/>
	<text x="516" y="380" fill="#8E8CA8" font-size="13" font-weight="600" letter-spacing="1">CONTINUE WHEN USAGE RESETS</text>
	<rect x="516" y="396" width="380" height="60" rx="10" fill="#16152D" stroke="#2F2C55"/>
	<circle cx="538" cy="418" r="7" fill="none" stroke="#00EC95" stroke-width="2" stroke-dasharray="28 16"/>
	<text x="556" y="423" fill="#F8F7FA" font-size="14">Waiting for the Work account's 5-hour</text>
	<text x="556" y="443" fill="#F8F7FA" font-size="14">limit to reset at 14:05…</text>
	<text x="516" y="482" fill="#BCBBCA" font-size="14">Then the chat continues on Work. Stop cancels it.</text>

	<!-- Footer: when no account is left -->
	<text x="40" y="548" fill="#8E8CA8" font-size="13">No account left? Set Chat › Subscription Accounts: When No Account Left to Wait for Reset, and chats wait by themselves.</text>
</svg>
